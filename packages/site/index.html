<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <link rel="icon" type="image/svg+xml" href="%BASE_URL%favicon.svg" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <meta
            name="description"
            content="Termicolor - a high contrast, bright, techy color system for your editor, terminal, browser and more."
        />
        <title>Termicolor</title>
        <script>
            // Apply the stored theme before first paint (keys match src/hooks/use-theme.ts).
            (function () {
                var read = function (key, fallback) {
                    try {
                        return JSON.parse(localStorage.getItem(key)) || fallback;
                    } catch (e) {
                        return fallback;
                    }
                };
                var pref = read("termicolor-theme", "system");
                var dark =
                    pref === "dark" || (pref === "system" && !matchMedia("(prefers-color-scheme: light)").matches);
                var root = document.documentElement.classList;
                root.toggle("dark", dark);
                root.toggle("light", !dark);
                root.toggle("hc", read("termicolor-contrast", "normal") === "high");
            })();
        </script>
    </head>
    <body>
        <div id="root"></div>
        <script type="module" src="/src/main.tsx"></script>
    </body>
</html>
