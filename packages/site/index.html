<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <meta
            name="description"
            content="Termicolor - a high contrast, bright, techy color system for your editor, terminal, browser and more."
        />
        <title>Termicolor</title>
        <script>
            // Apply the stored theme before first paint to avoid a light flash.
            (function () {
                var pref = JSON.parse(localStorage.getItem("termicolor-theme") || '"system"');
                var dark =
                    pref === "dark" || (pref === "system" && !matchMedia("(prefers-color-scheme: light)").matches);
                document.documentElement.classList.toggle("dark", dark);
            })();
        </script>
    </head>
    <body>
        <div id="root"></div>
        <script type="module" src="/src/main.tsx"></script>
    </body>
</html>
