"$schema" = 'https://starship.rs/config-schema.json'

# Termicolor powerline - generated by https://github.com/repraze/termicolor

format = """
[](fg:fill_red)\
$os\
$username\
[](bg:fill_orange fg:fill_red)\
$directory\
[](bg:fill_yellow fg:fill_orange)\
$git_branch\
$git_status\
[](fg:fill_yellow bg:fill_green)\
$c\
$rust\
$golang\
$nodejs\
$php\
$java\
$kotlin\
$haskell\
$python\
[](fg:fill_green bg:fill_blue)\
$conda\
[](fg:fill_blue bg:fill_purple)\
$time\
[ ](fg:fill_purple)\
$cmd_duration\
$line_break\
$character"""

palette = 'termicolor_light'

[os]
disabled = false
style = "bg:fill_red fg:on_fill_red"

[os.symbols]
Windows = ""
Ubuntu = "󰕈"
SUSE = ""
Raspbian = "󰐿"
Mint = "󰣭"
Macos = "󰀵"
Manjaro = ""
Linux = "󰌽"
Gentoo = "󰣨"
Fedora = "󰣛"
Alpine = ""
Amazon = ""
Android = ""
AOSC = ""
Arch = "󰣇"
Artix = "󰣇"
CentOS = ""
Debian = "󰣚"
Redhat = "󱄛"
RedHatEnterprise = "󱄛"

[username]
show_always = true
style_user = "bg:fill_red fg:on_fill_red"
style_root = "bg:fill_red fg:on_fill_red"
format = '[ $user]($style)'

[directory]
style = "bg:fill_orange fg:on_fill_orange"
format = "[ $path ]($style)"
truncation_length = 3
truncation_symbol = "…/"

[directory.substitutions]
"Documents" = "󰈙 "
"Downloads" = " "
"Music" = "󰝚 "
"Pictures" = " "
"Developer" = "󰲋 "

[git_branch]
symbol = ""
style = "bg:fill_yellow"
format = '[[ $symbol $branch ](fg:on_fill_yellow bg:fill_yellow)]($style)'

[git_status]
style = "bg:fill_yellow"
format = '[[($all_status$ahead_behind )](fg:on_fill_yellow bg:fill_yellow)]($style)'

[nodejs]
symbol = ""
style = "bg:fill_green"
format = '[[ $symbol( $version) ](fg:on_fill_green bg:fill_green)]($style)'

[c]
symbol = " "
style = "bg:fill_green"
format = '[[ $symbol( $version) ](fg:on_fill_green bg:fill_green)]($style)'

[rust]
symbol = ""
style = "bg:fill_green"
format = '[[ $symbol( $version) ](fg:on_fill_green bg:fill_green)]($style)'

[golang]
symbol = ""
style = "bg:fill_green"
format = '[[ $symbol( $version) ](fg:on_fill_green bg:fill_green)]($style)'

[php]
symbol = ""
style = "bg:fill_green"
format = '[[ $symbol( $version) ](fg:on_fill_green bg:fill_green)]($style)'

[java]
symbol = " "
style = "bg:fill_green"
format = '[[ $symbol( $version) ](fg:on_fill_green bg:fill_green)]($style)'

[kotlin]
symbol = ""
style = "bg:fill_green"
format = '[[ $symbol( $version) ](fg:on_fill_green bg:fill_green)]($style)'

[haskell]
symbol = ""
style = "bg:fill_green"
format = '[[ $symbol( $version) ](fg:on_fill_green bg:fill_green)]($style)'

[python]
symbol = ""
style = "bg:fill_green"
format = '[[ $symbol( $version)(\(#$virtualenv\)) ](fg:on_fill_green bg:fill_green)]($style)'

[docker_context]
symbol = ""
style = "bg:fill_blue"
format = '[[ $symbol( $context) ](fg:on_fill_blue bg:fill_blue)]($style)'

[conda]
symbol = "  "
style = "fg:on_fill_blue bg:fill_blue"
format = '[$symbol$environment ]($style)'
ignore_base = false

[time]
disabled = false
time_format = "%R"
style = "bg:fill_purple"
format = '[[  $time ](fg:on_fill_purple bg:fill_purple)]($style)'

[line_break]
disabled = true

[character]
disabled = false
success_symbol = '[❯](bold fg:green)'
error_symbol = '[❯](bold fg:red)'
vimcmd_symbol = '[❮](bold fg:green)'
vimcmd_replace_one_symbol = '[❮](bold fg:purple)'
vimcmd_replace_symbol = '[❮](bold fg:purple)'
vimcmd_visual_symbol = '[❮](bold fg:yellow)'

[cmd_duration]
show_milliseconds = true
format = " in $duration "
style = "bg:fill_purple"
disabled = false
show_notifications = true
min_time_to_notify = 45000

[palettes.termicolor_light]
red = "#e20064"
orange = "#bb5500"
yellow = "#a16500"
green = "#00835c"
cyan = "#007f87"
blue = "#006af6"
purple = "#a331fb"
pink = "#d400ab"
fill_red = "#ff4c82"
fill_orange = "#ff9243"
fill_yellow = "#f2c224"
fill_green = "#35e0a3"
fill_cyan = "#2edfeb"
fill_blue = "#4d91ff"
fill_purple = "#bb7aff"
fill_pink = "#ff60d4"
on_fill_red = "#250e13"
on_fill_orange = "#241004"
on_fill_yellow = "#1d1500"
on_fill_green = "#021c11"
on_fill_cyan = "#001a1d"
on_fill_blue = "#0b1628"
on_fill_purple = "#1a1125"
on_fill_pink = "#220e1c"
text = "#0a0a0a"
subtext = "#525252"
surface = "#f5f5f5"
base = "#ffffff"
crust = "#fafafa"
