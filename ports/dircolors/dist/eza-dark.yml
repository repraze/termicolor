# Termicolor dark for eza - generated by https://github.com/repraze/termicolor
# Copy to ${EZA_CONFIG_DIR:-${XDG_CONFIG_HOME:-~/.config}/eza}/theme.yml
colourful: true

filekinds:
  normal: {foreground: "#fafafa"}
  directory: {foreground: "#4d91ff", is_bold: true}
  symlink: {foreground: "#2edfeb"}
  pipe: {foreground: "#f2c224"}
  block_device: {foreground: "#f2c224", is_bold: true}
  char_device: {foreground: "#f2c224", is_bold: true}
  socket: {foreground: "#ff60d4", is_bold: true}
  special: {foreground: "#f2c224"}
  executable: {foreground: "#35e0a3", is_bold: true}
  mount_point: {foreground: "#4d91ff", is_bold: true, is_underline: true}

perms:
  user_read: {foreground: "#f2c224", is_bold: true}
  user_write: {foreground: "#ff4c82", is_bold: true}
  user_execute_file: {foreground: "#35e0a3", is_bold: true, is_underline: true}
  user_execute_other: {foreground: "#35e0a3", is_bold: true}
  group_read: {foreground: "#f2c224"}
  group_write: {foreground: "#ff4c82"}
  group_execute: {foreground: "#35e0a3"}
  other_read: {foreground: "#f2c224"}
  other_write: {foreground: "#ff4c82"}
  other_execute: {foreground: "#35e0a3"}
  special_user_file: {foreground: "#bb7aff"}
  special_other: {foreground: "#bb7aff"}
  attribute: {foreground: "#a3a3a3"}

size:
  major: {foreground: "#35e0a3", is_bold: true}
  minor: {foreground: "#35e0a3"}
  number_byte: {foreground: "#fafafa"}
  number_kilo: {foreground: "#35e0a3"}
  number_mega: {foreground: "#f2c224"}
  number_giga: {foreground: "#ff9243"}
  number_huge: {foreground: "#ff4c82", is_bold: true}
  unit_byte: {foreground: "#a3a3a3"}
  unit_kilo: {foreground: "#35e0a3"}
  unit_mega: {foreground: "#f2c224"}
  unit_giga: {foreground: "#ff9243"}
  unit_huge: {foreground: "#ff4c82"}

users:
  user_you: {foreground: "#f2c224", is_bold: true}
  user_root: {foreground: "#ff4c82"}
  user_other: {foreground: "#a3a3a3"}
  group_yours: {foreground: "#f2c224"}
  group_other: {foreground: "#a3a3a3"}
  group_root: {foreground: "#ff4c82"}

links:
  normal: {foreground: "#2edfeb", is_bold: true}
  multi_link_file: {foreground: "#001a1d", background: "#2edfeb"}

git:
  new: {foreground: "#35e0a3"}
  modified: {foreground: "#4d91ff"}
  deleted: {foreground: "#ff4c82"}
  renamed: {foreground: "#2edfeb"}
  typechange: {foreground: "#bb7aff"}
  ignored: {foreground: "#737373"}
  conflicted: {foreground: "#ff9243", is_bold: true}

git_repo:
  branch_main: {foreground: "#35e0a3"}
  branch_other: {foreground: "#f2c224"}
  git_clean: {foreground: "#35e0a3"}
  git_dirty: {foreground: "#f2c224"}

security_context:
  colon: {foreground: "#737373"}
  user: {foreground: "#4d91ff"}
  role: {foreground: "#35e0a3"}
  typ: {foreground: "#f2c224"}
  range: {foreground: "#2edfeb"}

file_type:
  image: {foreground: "#bb7aff"}
  video: {foreground: "#ff60d4"}
  music: {foreground: "#2edfeb"}
  lossless: {foreground: "#2edfeb", is_bold: true}
  crypto: {foreground: "#35e0a3", is_bold: true}
  document: {foreground: "#ff9243"}
  compressed: {foreground: "#ff4c82"}
  temp: {foreground: "#737373"}
  compiled: {foreground: "#f2c224"}
  build: {foreground: "#f2c224", is_bold: true, is_underline: true}
  source: {foreground: "#f2c224", is_bold: true}

punctuation: {foreground: "#737373"}
date: {foreground: "#4d91ff"}
inode: {foreground: "#bb7aff"}
blocks: {foreground: "#2edfeb"}
header: {foreground: "#fafafa", is_underline: true}
octal: {foreground: "#bb7aff"}
flags: {foreground: "#a3a3a3"}

symlink_path: {foreground: "#2edfeb"}
control_char: {foreground: "#ff4c82"}
broken_symlink: {foreground: "#ff4c82", is_bold: true, is_underline: true}
broken_path_overlay: {is_underline: true}
