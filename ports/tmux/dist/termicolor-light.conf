# Termicolor for tmux - generated by https://github.com/repraze/termicolor
# Light - source this file from ~/.tmux.conf. Leaves the terminal's own colors alone.

# Status bar
set -g status-style 'bg=#fafafa,fg=#525252'
set -g status-left-length '40'
set -g status-right-length '60'
set -g status-left '#{?client_prefix,#[bg=#f2c224#,fg=#1d1500],#[bg=#bb7aff#,fg=#1a1125]}#[bold] #S #[default] '
set -g status-right '#[fg=#525252]%Y-%m-%d #[fg=#0a0a0a,bold]%H:%M #[bg=#f5f5f5,fg=#0a0a0a,nobold] #h '

# Windows: the current one is an accent index next to fg text, others are soft
set -g window-status-separator ''
set -g window-status-style 'bg=#fafafa,fg=#525252'
set -g window-status-format ' #I #W#{?window_zoomed_flag,#[fg=#a16500] +,} '
set -g window-status-current-style 'bg=#ffffff,fg=#0a0a0a'
set -g window-status-current-format ' #[fg=#a331fb,bold]#I #[fg=#0a0a0a,bold]#W#{?window_zoomed_flag,#[fg=#a16500] +,} '
set -g window-status-activity-style 'none,bg=#fafafa,fg=#a16500'
set -g window-status-bell-style 'bg=#fafafa,fg=#e20064,bold'

# Pane borders
set -g pane-border-style 'fg=#e5e5e5'
set -g pane-active-border-style 'fg=#a331fb'
set -g display-panes-colour '#737373'
set -g display-panes-active-colour '#a331fb'

# Messages and the command prompt
set -g message-style 'bg=#f5f5f5,fg=#0a0a0a'
set -g message-command-style 'bg=#f5f5f5,fg=#a331fb'

# Copy mode: selection, search matches (copy-mode-*-style needs tmux 3.4+), marks
set -g mode-style 'bg=#e2c9ff,fg=#0a0a0a'
set -g copy-mode-match-style 'bg=#e5b399,fg=#0a0a0a'
set -g copy-mode-current-match-style 'bg=#ff9243,fg=#241004'
set -g copy-mode-mark-style 'bg=#2edfeb,fg=#001a1d'
set -g clock-mode-colour '#a331fb'

# Popups and menus
set -g popup-style 'bg=#f5f5f5,fg=#0a0a0a'
set -g popup-border-style 'fg=#d4d4d4'
set -g menu-style 'bg=#f5f5f5,fg=#0a0a0a'
set -g menu-selected-style 'bg=#bb7aff,fg=#1a1125'
set -g menu-border-style 'fg=#d4d4d4'

# Optional: heavier pane borders (tmux 3.2+), e.g. single, double, heavy, simple
# set -g pane-border-lines heavy
