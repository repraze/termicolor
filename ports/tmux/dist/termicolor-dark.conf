# Termicolor for tmux - generated by https://github.com/repraze/termicolor
# Dark - source this file from ~/.tmux.conf. Leaves the terminal's own colors alone.

# Status bar
set -g status-style 'bg=#0a0a0a,fg=#a3a3a3'
set -g status-left-length '40'
set -g status-right-length '60'
set -g status-left '#{?client_prefix,#[bg=#f2c224#,fg=#1d1500],#[bg=#bb7aff#,fg=#1a1125]}#[bold] #S #[default] '
set -g status-right '#[fg=#a3a3a3]%Y-%m-%d #[fg=#fafafa,bold]%H:%M #[bg=#262626,fg=#fafafa,nobold] #h '

# Windows: the current one is an accent index next to fg text, others are soft
set -g window-status-separator ''
set -g window-status-style 'bg=#0a0a0a,fg=#a3a3a3'
set -g window-status-format ' #I #W#{?window_zoomed_flag,#[fg=#f2c224] +,} '
set -g window-status-current-style 'bg=#171717,fg=#fafafa'
set -g window-status-current-format ' #[fg=#bb7aff,bold]#I #[fg=#fafafa,bold]#W#{?window_zoomed_flag,#[fg=#f2c224] +,} '
set -g window-status-activity-style 'none,bg=#0a0a0a,fg=#f2c224'
set -g window-status-bell-style 'bg=#0a0a0a,fg=#ff4c82,bold'

# Pane borders
set -g pane-border-style 'fg=#262626'
set -g pane-active-border-style 'fg=#bb7aff'
set -g display-panes-colour '#737373'
set -g display-panes-active-colour '#bb7aff'

# Messages and the command prompt
set -g message-style 'bg=#262626,fg=#fafafa'
set -g message-command-style 'bg=#262626,fg=#bb7aff'

# Copy mode: selection, search matches (copy-mode-*-style needs tmux 3.4+), marks
set -g mode-style 'bg=#433455,fg=#fafafa'
set -g copy-mode-match-style 'bg=#764b2f,fg=#fafafa'
set -g copy-mode-current-match-style 'bg=#ff9243,fg=#241004'
set -g copy-mode-mark-style 'bg=#2edfeb,fg=#001a1d'
set -g clock-mode-colour '#bb7aff'

# Popups and menus
set -g popup-style 'bg=#262626,fg=#fafafa'
set -g popup-border-style 'fg=#404040'
set -g menu-style 'bg=#262626,fg=#fafafa'
set -g menu-selected-style 'bg=#bb7aff,fg=#1a1125'
set -g menu-border-style 'fg=#404040'

# Optional: heavier pane borders (tmux 3.2+), e.g. single, double, heavy, simple
# set -g pane-border-lines heavy
