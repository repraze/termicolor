name: Port test report
description: You tried a Termicolor port in the real app - share a screenshot and how it went.
title: "[test] "
labels: ["port-test"]
body:
    - type: markdown
      attributes:
          value: |
              Thanks for testing! Most ports are generated and haven't been checked in every app, so this helps a lot.
              Please read [TESTING.md](https://github.com/repraze/termicolor/blob/main/TESTING.md) first. In short:

              - **No personal data in screenshots**: use the sample files from [`testing/`](https://github.com/repraze/termicolor/tree/main/testing), a scratch folder, an empty profile or workspace. Hide names, emails, avatars, hostnames, paths with your username, tokens, chats and notifications.
              - **One screenshot per mode** you tried (dark / light), of the app window only, at 100% display scaling, PNG, around 1280×800.
    - type: input
      id: port
      attributes:
          label: Port
          description: The port id, as in the URL (e.g. `nvim`, `zed`, `obsidian`).
      validations:
          required: true
    - type: input
      id: app-version
      attributes:
          label: App and version
          placeholder: e.g. Neovim 0.11.2, Zed 0.190, Obsidian 1.9
      validations:
          required: true
    - type: input
      id: os
      attributes:
          label: OS
          placeholder: e.g. Windows 11, macOS 15, Ubuntu 24.04
    - type: checkboxes
      id: modes
      attributes:
          label: Modes tested
          options:
              - label: Dark
              - label: Light
              - label: Another accent (say which below)
    - type: dropdown
      id: result
      attributes:
          label: How did it go?
          options:
              - Looks right
              - Mostly right, a few things off
              - Broken or unreadable
      validations:
          required: true
    - type: textarea
      id: screenshots
      attributes:
          label: Screenshots
          description: Drag and drop images here. Check them for personal data before posting.
      validations:
          required: true
    - type: textarea
      id: notes
      attributes:
          label: Notes
          description: Anything that looked off - hard to read text, invisible hover or selection, wrong colors, install steps that didn't work.
    - type: checkboxes
      id: privacy
      attributes:
          label: Privacy
          options:
              - label: My screenshots contain no personal data (names, emails, avatars, paths, tokens, private content).
                required: true
